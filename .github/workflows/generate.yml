name: Generate Champions Calendar

on:
  workflow_dispatch:

schedule:
- cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate calendar
        run: |
          python src/generate_calendar.py

      - name: Commit calendar
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add docs/champions.ics

          git diff --staged --quiet || git commit -m "Update Champions calendar"

          git push
